name: Publicar ENEM gratuito
on:
  push:
    branches: [main]
    paths:
      - 'enem/**'
      - '.github/workflows/enem-pages.yml'
  workflow_dispatch:
    inputs:
      deep_verify:
        description: Repetir renderização dos PDFs no runner
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preservar as outras páginas já existentes
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: enem/package-lock.json
      - name: Validar configuração pública
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Adicione VITE_SUPABASE_URL em Settings > Secrets and variables > Actions > Variables.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Adicione VITE_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables.'; exit 1; }
      - run: npm ci
        working-directory: enem
      - name: Validar banco local e gabaritos
        run: npm run validate:release
        working-directory: enem
      - run: npm test
        working-directory: enem
      - uses: actions/setup-python@v5
        if: inputs.deep_verify == true
        with:
          python-version: '3.12'
      - name: Preparar verificação dos documentos originais
        if: inputs.deep_verify == true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m pip install -r scripts/requirements-enem.txt
        working-directory: enem
      - name: Comparar questões com os PDFs oficiais
        if: inputs.deep_verify == true
        run: npm run verify:originals
        working-directory: enem
      - name: Compilar site com Supabase
        run: npm run build:pages
        working-directory: enem
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Preparar site completo preservando o Prumo
        run: |
          mkdir -p site/enem
          rsync -a --exclude='.git' --exclude='.github' previous-site/ site/
          rsync -a --delete enem/dist/ site/enem/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
