name: Publicar edição ENEM
on:
  push:
    branches: [main]
    paths:
      - 'enem/**'
      - '.github/workflows/enem-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preservar as outras páginas já existentes
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: enem/package-lock.json
      - name: Validar configuração pública
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Adicione VITE_SUPABASE_URL em Settings > Secrets and variables > Actions > Variables.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Adicione VITE_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables.'; exit 1; }
      - run: npm ci
        working-directory: enem
      - name: Validar banco local e gabaritos
        run: npm run validate:questions
        working-directory: enem
      - run: npm test
        working-directory: enem
      - name: Compilar site com Supabase
        run: npm run build:sales
        working-directory: enem
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Preparar site completo preservando o Prumo
        run: |
          mkdir -p site/enem
          rsync -a --exclude='.git' --exclude='.github' previous-site/ site/
          rsync -a --delete enem/dist/ site/enem/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
